<template>
<article class="slds-card">
<div class="slds-card__body">
	<lightning-layout>
		<lightning-layout-item flexibility="grow">
			<lightning-input type="search"
				name="searchProducts"
				variant="label-hidden"
				placeholder="Search Order Products..."
				onchange={handleOnSearchProductsChange}></lightning-input>
		</lightning-layout-item>
		<lightning-layout-item lwc:if={isEdit}
			class="slds-var-m-left_small">
			<lightning-button-group>
				<lightning-button
					icon-name="utility:add"
					label="New Group"
					onclick={handleOnAddGroupClick}></lightning-button>
			</lightning-button-group>
		</lightning-layout-item>
		<lightning-layout-item
			class="slds-var-m-left_small">
			<lightning-button-menu icon-name="utility:settings"
				alternative-text="View Options"
				menu-alignment="right"
				variant="border-filled"
				onselect={handleOnViewChange}>
				<lightning-menu-item for:each={modeOptions}
					for:item="option"
					key={option.value}
					value={option.value}
					label={option.label}
					checked={option.isChecked}
					icon-name={option.iconName}></lightning-menu-item>
				<!-- <lightning-menu-divider></lightning-menu-divider>
				<lightning-menu-item for:each={listViewOptions}
					for:item="option"
					key={option.value}
					value={option.value}
					label={option.label}
					checked={option.isChecked}
					icon-name={option.iconName}></lightning-menu-item> -->
			</lightning-button-menu>
		</lightning-layout-item>
	</lightning-layout>
	<div for:each={groups}
		for:item="group"
		for:index="index"
		key={group.uniqueId}
		class="slds-var-m-top_small">
		<template lwc:if={group.isPlaceHolder}>
			<c-delivery-group-card lwc:if={group.products.length}
				delivery-group={group}
				product-count={group.products.length}
				mode={mode}>
				<c-product-manager products={group.products}
					mode={mode}
					hide-add-products={hideAddProducts}
					onproductcreate={handleOnProductCreated}
					onproductchange={handleOnProductChange}
					onproductdelete={handleOnProductDelete}
					onproductdragstart={handleOnProductDragStart}
					onproductdragend={handleOnProductDragEnd}
					oncreateworkorder={handleOnCreateWorkOrder}></c-product-manager>
			</c-delivery-group-card>
		</template>
		<div lwc:else
			class="slds-is-relative">
			<c-delivery-group-card
				record-id={group.uniqueId}
				product-count={group.products.length}
				mode={mode}
				ongroupedit={handleOnGroupEdit}
				ongroupclone={handleOnGroupClone}
				ongroupdelete={handleOnGroupDelete}>
				<c-product-manager products={group.products}
					mode={mode}
					hide-add-products={hideAddProducts}
					data-group-id={group.uniqueId}
					onproductcreate={handleOnProductCreated}
					onproductchange={handleOnProductChange}
					onproductdelete={handleOnProductDelete}
					onproductdragstart={handleOnProductDragStart}
					onproductdragend={handleOnProductDragEnd}
					oncreateworkorder={handleOnCreateWorkOrder}></c-product-manager>
			</c-delivery-group-card>
			<div lwc:if={group.isDropEnabled}
				data-group-id={group.uniqueId}
				data-dragging={group.isDragging}
				ondragover={handleOnDragOver}
				ondragleave={handleOnDragLeave}
				ondrop={handleOnDrop}
				class="dropzone anchor-all">
				&nbsp;
			</div>
		</div>
	</div>
	<div class="slds-var-m-top_small">
		<c-discount-manager
			products={discounts}
			mode={mode}
			hide-add-products={hideAddProducts}
			onproductcreate={handleOnProductCreated}
			onproductchange={handleOnProductChange}
			onproductdelete={handleOnProductDelete}></c-discount-manager>
	</div>
</div>
<lightning-spinner lwc:if={isLoading}
	variant="brand"
	alternative-text="Loading..."></lightning-spinner>
</article>
</template>
