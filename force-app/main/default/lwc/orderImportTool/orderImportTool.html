<template>
<lightning-card title="Order Import" icon-name="standard:orders">
	<div class="slds-p-horizontal_medium slds-p-vertical_small">
		<p class="slds-text-body_small slds-m-bottom_small">
			Select the account once, then upload an Excel-compatible
			CSV to create Orders and Products in bulk.
		</p>

		<div lwc:if={showAccountPicker}
			class="slds-m-bottom_small">
			<lightning-record-picker
				label="Account"
				required
				placeholder="Select the customer for this file"
				object-api-name="Account"
				value={selectedAccountId}
				onchange={handleCustomerChange}>
			</lightning-record-picker>
		</div>

		<div class="slds-m-bottom_small">
			<div class="">
				<lightning-input
					type="file"
					label="Upload File"
					accept=".csv,text/csv"
					onchange={handleFileChange}>
				</lightning-input>
				<template lwc:if={hasSelectedFile}>
					<p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
						Selected file: <b>{selectedFileName}</b>
					</p>
				</template>
			</div>
			<div class="actions-col slds-m-top_small">
				<lightning-button
					variant="brand"
					label="Import"
					onclick={handleImport}
					disabled={disableImport}>
				</lightning-button>
			</div>
		</div>

		<template lwc:if={result}>
			<div class="slds-box slds-theme_default slds-m-bottom_small">
				<p><strong>Total Rows:</strong> {result.totalRows}</p>
				<p><strong>Orders Created:</strong> {result.ordersCreated}</p>
				<p><strong>Order Products Created:</strong> {result.orderItemsCreated}</p>
				<p><strong>Failed Rows:</strong> {result.failedRows}</p>
			</div>
		</template>

		<template lwc:if={hasRowErrors}>
			<lightning-datatable
				key-field="key"
				data={rowErrors}
				columns={errorColumns}
				hide-checkbox-column>
			</lightning-datatable>
		</template>

		<div class="slds-m-top_medium
				slds-p-top_small
				slds-border_top">
			<p class="slds-text-color_weak slds-text-body_small slds-m-bottom_small">
				Use the downloaded template and keep the header row unchanged. Rows with the same Order Reference Number belong to the same order. Rows with the same Delivery Group Name and Due Date belong to the same delivery group.
			</p>
			<div>
				<lightning-button
					label="Download Template"
					onclick={handleDownloadTemplate}
					disabled={disableTemplateDownload}
					class="slds-m-right_x-small">
				</lightning-button>
			</div>
		</div>
	</div>

	<lightning-spinner lwc:if={isLoading} alternative-text="Loading"></lightning-spinner>
</lightning-card>
</template>
