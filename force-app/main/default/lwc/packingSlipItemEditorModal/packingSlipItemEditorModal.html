<template>
	<!-- Modal Header -->
	<lightning-modal-header label="Edit Packing Slip Items"></lightning-modal-header>

	<!-- Modal Body -->
	<lightning-modal-body>
		<c-packing-slip-item-editor
			record-id={packingSlipId}
			mode="edit"
			onitemsaved={handleItemsSaved}
		></c-packing-slip-item-editor>
	</lightning-modal-body>

	<!-- Modal Footer -->
	<lightning-modal-footer>
		<lightning-button 
			variant="neutral" 
			label="Close" 
			onclick={handleClose}
		></lightning-button>
	</lightning-modal-footer>
</template>
