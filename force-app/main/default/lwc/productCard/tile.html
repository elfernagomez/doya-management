<template>
<div class={mainViewClass}>
<div class="slds-media slds-media_small">
	<div class="slds-media__figure slds-var-p-vertical_xx-small">
		<lightning-button-icon icon-name="utility:drag_and_drop"
			title="Drag to move to another delivery group"
			variant="bare"
			small="small"
			onmousedown={handleOnHandlerMouseDown}></lightning-button-icon>
	</div>
	<div class="slds-media__body">
		<div lwc:if={_product.description}
			class="slds-media
				slds-media_small
				slds-media_center
				slds-var-m-bottom_x-small">
			<div class="slds-media__body">
				<h3 title={_product.description}
					class="slds-text-heading_small slds-truncate">
					{_product.description}
				</h3>
			</div>
			<div lwc:if={_product.workOrderStatus}
				class="slds-media__figure_reverse">
				<c-status-indicator status={_product.workOrderStatus}>
				</c-status-indicator>
			</div>
		</div>
		<div class="slds-var-p-right_small">
			<div class="slds-media slds-media_small">
				<div class="slds-media__figure">
					<lightning-icon icon-name="standard:product"
						title={_product.productName}
						size="x-small"></lightning-icon>
				</div>
				<div class="slds-media__body">
					<ul class="slds-list_horizontal slds-has-dividers_left">
						<li class="slds-item">
							<h3><b>{_product.productName}</b></h3>
						</li>
						<li class="slds-item">
							<span>{_product.productCode}</span>
						</li>
						<li lwc:if={_product.isPart}
							class="slds-item">
							<lightning-badge label="Part"></lightning-badge>
						</li>
					</ul>
				</div>
			</div>
		</div>
		<lightning-layout multiple-rows="true">
			<lightning-layout-item lwc:if={showQty}>
			<dl class="slds-dl_inline
					slds-var-m-top_small
					slds-var-m-right_medium">
				<dt title="Qty"
					class="slds-dl_inline__label
						slds-text-color_weak">Qty</dt>
				<dd title="Qty"
					class="slds-dl_inline__detail">
					<lightning-formatted-number
						maximum-fraction-digits="2"
						value={_product.qty}
						></lightning-formatted-number>&nbsp;
				</dd>
			</dl>
			</lightning-layout-item>
			<lightning-layout-item lwc:if={showUnitType}>
			<dl class="slds-dl_inline
					slds-var-m-top_small
					slds-var-m-right_medium">
				<dt title="Unit Type"
					class="slds-dl_inline__label
						slds-text-color_weak">Unit Type</dt>
				<dd title="Unit Type"
					class="slds-dl_inline__detail">
					{_product.unitType}&nbsp;
				</dd>
			</dl>
			</lightning-layout-item>
			<lightning-layout-item lwc:if={showDimensions}>
			<dl class="slds-dl_inline
					slds-var-m-top_small
					slds-var-m-right_medium">
				<dt title="Dimensions"
					class="slds-dl_inline__label
						slds-text-color_weak">Dimensions</dt>
				<dd title="Dimensions"
					class="slds-dl_inline__detail">
					<span class="slds-show_inline-block
							slds-var-p-right_xx-small">
						<span class="slds-text-body_small">W</span>
						<lightning-formatted-number
							maximum-fraction-digits="2"
							value={_product.width}
							class="slds-var-p-right_xx-small"
							></lightning-formatted-number>
					</span>
					<label class="slds-text-body_small
						slds-var-p-right_xx-small">&times;</label>
					<span class="slds-show_inline-block
							slds-var-p-right_xx-small">
						<span class="slds-text-body_small">H</span>
						<lightning-formatted-number
							maximum-fraction-digits="2"
							value={_product.height}
							class="slds-var-p-right_xx-small"
							></lightning-formatted-number>
					</span>
					<template lwc:if={_product.depth}>
						<label class="slds-text-body_small
							slds-var-p-right_xx-small">&times;</label>
						<span class="slds-show_inline-block
								slds-var-p-right_xx-small">
							<span class="slds-text-body_small">D</span>
							<lightning-formatted-number
								maximum-fraction-digits="2"
								value={_product.depth}
								class="slds-var-p-right_xx-small"
								></lightning-formatted-number>
						</span>
					</template>
				</dd>
			</dl>
			</lightning-layout-item>
			<lightning-layout-item lwc:if={showUnitPrice}>
			<dl class="slds-dl_inline
					slds-var-m-top_small
					slds-var-m-right_medium">
				<dt title="Unit Price"
					class="slds-dl_inline__label
						slds-text-color_weak">Unit Price</dt>
				<dd title="Unit Price"
					class="slds-dl_inline__detail">
					<lightning-formatted-number 
						format-style="currency"
						currency-code="USD"
						value={_product.unitPrice}
						></lightning-formatted-number>&nbsp;
				</dd>
			</dl>
			</lightning-layout-item>
			<!-- <lightning-layout-item>
			<dl class="slds-dl_inline
					slds-var-m-top_small
					slds-var-m-right_medium">
				<dt title="Delivery Group"
					class="slds-dl_inline__label
						slds-text-color_weak">Delivery Group</dt>
				<dd title="Delivery Group"
					class="slds-dl_inline__detail">
					<a href="#"
						onclick={handleOnGroupClick}
						class="">{_product.groupName}</a>&nbsp;
				</dd>
			</dl>
			</lightning-layout-item> -->
		</lightning-layout>
	</div>
</div>
</div>
</template>
