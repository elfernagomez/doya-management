<template>
<div lwc:if={isView}
	class={mainViewClass}>
	<div class="slds-media__body">
		<div lwc:if={_product.description}
			class="slds-media
				slds-media_small
				slds-media_center
				slds-var-m-bottom_x-small">
			<div class="slds-media__body slds-var-p-horizontal_small">
				<h3 title={_product.description}
					class="slds-text-heading_small slds-truncate">
					{_product.description}
				</h3>
			</div>
			<div lwc:if={_product.workOrderStatus}
				class="slds-media__figure_reverse slds-var-p-vertical_xx-small">
				<c-status-indicator status={_product.workOrderStatus}>
				</c-status-indicator>
			</div>
		</div>
		<div class="slds-media
				slds-media_small
				slds-border_top
				slds-is-relative">
			<div class="slds-media__body slds-var-p-horizontal_small">
				<lightning-layout vertical-align="stretch">
					<lightning-layout-item size="12"
						large-device-size={productColumnSize}
						class="slds-var-p-right_small
							slds-var-p-top_x-small">
						<div class="slds-media slds-media_small">
							<div class="slds-media__figure">
								<lightning-icon icon-name="standard:product"
									title={_product.productName}
									size="x-small"></lightning-icon>
							</div>
							<div class="slds-media__body">
								<h3 title={_product.productName}>
									<b>{_product.productName}</b>
								</h3>
								<p lwc:if={_product.productCode}
									class="slds-text-body_small">
									<i>{_product.productCode}</i>
								</p>
								<div lwc:if={_product.isPart}
									title={_product.parentItemProductName}
									class="slds-var-p-vertical_x-small">
									<lightning-badge label="Part"></lightning-badge>
								</div>
							</div>
						</div>
					</lightning-layout-item>
					<lightning-layout-item
						flexibility="grow"
						class="slds-border_left
							slds-var-p-horizontal_large">
						<lightning-layout multiple-rows="true">
							<lightning-layout-item lwc:if={showQty}
								class="slds-var-m-right_xx-large
									slds-var-m-bottom_x-small">
								<div class="slds-form-element">
									<label class="slds-form-element__label">
										Qty
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											<lightning-formatted-number
												maximum-fraction-digits="2"
												value={_product.qty}
												></lightning-formatted-number>&nbsp;
										</div>
									</div>
								</div>
							</lightning-layout-item>
							<lightning-layout-item lwc:if={showUnitType}
								class="slds-var-m-right_xx-large
									slds-var-m-bottom_x-small">
								<div class="slds-form-element">
									<label class="slds-form-element__label">
										Unit Type
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											{_product.unitType}&nbsp;
										</div>
									</div>
								</div>
							</lightning-layout-item>
							<lightning-layout-item lwc:if={showDimensions}
								class="slds-var-m-right_xx-large
									slds-var-m-bottom_x-small">
								<div class="slds-form-element">
									<label class="slds-form-element__label">
										Dimensions
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											<span class="slds-show_inline-block
													slds-var-p-right_xx-small">
												<span class="slds-text-body_small">W</span>
												<lightning-formatted-number
													maximum-fraction-digits="2"
													value={_product.width}
													class="slds-var-p-right_xx-small"
													></lightning-formatted-number>
											</span>
											<label class="slds-text-body_small
												slds-var-p-right_xx-small">&times;</label>
											<span class="slds-show_inline-block
													slds-var-p-right_xx-small">
												<span class="slds-text-body_small">H</span>
												<lightning-formatted-number
													maximum-fraction-digits="2"
													value={_product.height}
													class="slds-var-p-right_xx-small"
													></lightning-formatted-number>
											</span>
											<template lwc:if={_product.depth}>
												<label class="slds-text-body_small
													slds-var-p-right_xx-small">&times;</label>
												<span class="slds-show_inline-block
														slds-var-p-right_xx-small">
													<span class="slds-text-body_small">D</span>
													<lightning-formatted-number
														maximum-fraction-digits="2"
														value={_product.depth}
														class="slds-var-p-right_xx-small"
														></lightning-formatted-number>
												</span>
											</template>
										</div>
									</div>
								</div>
							</lightning-layout-item>
							<lightning-layout-item lwc:if={showUnitPrice}
								class="slds-var-m-right_xx-large
									slds-var-m-bottom_x-small">
								<div class="slds-form-element">
									<label class="slds-form-element__label">
										Unit Price
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											<lightning-formatted-number 
												format-style="currency"
												currency-code="USD"
												value={_product.unitPrice}
												></lightning-formatted-number>&nbsp;
										</div>
									</div>
								</div>
							</lightning-layout-item>
						</lightning-layout>
					</lightning-layout-item>
					<lightning-layout-item lwc:if={showTotals}
						class="slds-border_left"
						style="min-width:12rem;">
						<lightning-layout>
							<lightning-layout-item size="6"
								class="slds-var-p-horizontal_small">
								<div class="slds-form-element">
									<label class="slds-form-element__label slds-no-flex">
										Price
									</label>
									<div class="slds-text-heading_small">
										<lightning-formatted-number 
											format-style="currency"
											currency-code="USD"
											value={_product.listPrice}
											></lightning-formatted-number>
									</div>
								</div>
							</lightning-layout-item>
							<lightning-layout-item size="6"
								class="slds-var-p-horizontal_small">
								<div class="slds-form-element">
									<label class="slds-form-element__label slds-no-flex">
										Total
									</label>
									<div class="slds-text-heading_small">
										<lightning-formatted-number 
											format-style="currency"
											currency-code="USD"
											value={_product.totalPrice}
											></lightning-formatted-number>
									</div>
								</div>
							</lightning-layout-item>
						</lightning-layout>
					</lightning-layout-item>
				</lightning-layout>
			</div>
		</div>
		<div lwc:if={_product.notes}
			class="slds-border_top
				slds-media
				slds-media_small
				slds-var-p-horizontal_small
				slds-var-p-top_x-small
				slds-var-p-bottom_x-small">
			<div class="slds-media__figure slds-var-p-vertical_xx-small">
				<lightning-icon icon-name="utility:note"
					title="Notes"
					size="x-small"></lightning-icon>
			</div>
			<div class="slds-media__body">
				<lightning-formatted-text 
					value={_product.notes}></lightning-formatted-text>
			</div>
		</div>
		<div lwc:if={showPartsToggle}
			title={_product.parentItemProductName}
			class="slds-border_top
				slds-var-p-horizontal_small">
			<lightning-button lwc:if={_product.showParts}
				variant="base"
				label="Parts"
				title="Hide Parts"
				icon-name="utility:chevrondown"
				onclick={handleOnShowPartsToggleClick}></lightning-button>
			<lightning-button lwc:else
				variant="base"
				label="Parts"
				title="Show Parts"
				icon-name="utility:chevronright"
				onclick={handleOnShowPartsToggleClick}></lightning-button>
		</div>
	</div>
	<div lwc:if={showDeleteButton}
		class="slds-media__figure slds-media__figure_reverse">
		<lightning-button-group>
			<lightning-button-icon
				icon-name="utility:delete"
				title="Remove Product From Current Order"
				disabled={_product.isDisabled}
				onclick={handleOnDeleteProductClick}></lightning-button-icon>

			<lightning-button-menu lwc:if={showCreateWorkOrderButton}
				alternative-text="Show menu"
				onselect={handleOnMenuSelect}
				menu-alignment="right">
				<template lwc:if={_product.isNew}></template>
				<lightning-menu-item lwc:else
					value="createWorkOrder"
					label="Create Work Order"
					prefix-icon-name="utility:new"></lightning-menu-item>
			</lightning-button-menu>
		</lightning-button-group>
	</div>
</div>
<div lwc:if={isEdit}
	data-product-id={_product.uniqueId}
	data-group-id={_product.groupId}
	class={mainEditClass}>
	<div class="slds-media__figure slds-var-p-vertical_xx-small">
		<lightning-button-icon icon-name="utility:drag_and_drop"
			title="Drag to move to another delivery group"
			variant="bare"
			small="small"
			onmousedown={handleOnHandlerMouseDown}></lightning-button-icon>
	</div>
	<div class="slds-media__body">
		<div class="slds-border_bottom">
			<lightning-input label="Line Description"
				placeholder="Add a desccription..."
				disabled={_product.isDisabled}
				value={_product.description}
				variant="label-stacked"
				data-src="product"
				data-field="description"
				data-type="string"
				onblur={handleFieldChange}></lightning-input>
		</div>
		<lightning-layout vertical-align="stretch">
			<lightning-layout-item size="3"
				class="slds-var-p-right_small
					slds-var-p-top_x-small">
				<div class="slds-media slds-media_small">
					<div class="slds-media__figure">
						<lightning-icon icon-name="standard:product"
							title={_product.productName}
							size="x-small"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<h3 title={_product.productName}>
							<b>{_product.productName}</b>
						</h3>
						<p class="slds-text-body_small">
							{_product.productCode}
						</p>
						<div lwc:if={_product.isPart}
							title={_product.parentItemProductName}
							class="slds-var-p-vertical_x-small">
							<lightning-badge label="Part"></lightning-badge>
						</div>
					</div>
				</div>
			</lightning-layout-item>
			<lightning-layout-item flexibility="grow"
				class="slds-border_left slds-var-p-horizontal_small">
				<lightning-layout multiple-rows="true">
					<lightning-layout-item lwc:if={showQty}>
						<lightning-input type="number"
							label="Qty"
							step="1"
							min="1"
							disabled={_product.isDisabled}
							value={_product.qty}
							variant="label-stacked"
							data-src="product"
							data-field="qty"
							data-type="float"
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
					<lightning-layout-item lwc:if={showUnitType}>
						<lightning-select label="Unit Type"
							disabled={_product.isDisabled}
							options={unitTypeOptions}
							type="button"
							value={_product.unitType}
							variant="label-stacked"
							data-src="product"
							data-field="unitType"
							data-type="string"
							onchange={handleFieldChange}
							class="medium-row"></lightning-select>
					</lightning-layout-item>
					<lightning-layout-item lwc:if={showDimensions}>
						<lightning-input type="number"
							label="Width"
							formatter="decimal"
							step="0.01"
							value={_product.width}
							variant="label-stacked"
							data-src="product"
							data-field="width"
							data-type="float"
							disabled={isDimensionsDisabled}
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
					<lightning-layout-item lwc:if={showDimensions}>
						<lightning-input type="number"
							label="Height"
							formatter="decimal"
							step="0.01"
							value={_product.height}
							variant="label-stacked"
							data-src="product"
							data-field="height"
							data-type="float"
							disabled={isDimensionsDisabled}
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
					<lightning-layout-item lwc:if={showDimensions}>
						<lightning-input lwc:if={_product.depth}
							type="number"
							label="Depth"
							formatter="decimal"
							step="0.01"
							value={_product.depth}
							variant="label-stacked"
							data-src="product"
							data-field="depth"
							data-type="float"
							disabled
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
					<lightning-layout-item>
						<lightning-input type="number"
							label="Unit Price"
							formatter="currency"
							step="0.01"
							disabled={_product.isDisabled}
							value={_product.unitPrice}
							variant="label-stacked"
							data-src="product"
							data-field="unitPrice"
							data-type="float"
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
				</lightning-layout>
			</lightning-layout-item>
			<lightning-layout-item class="slds-border_left"
				style="min-width:12rem;">
				<lightning-layout multiple-rows="true">
					<lightning-layout-item size="12"
						medium-device-size="6"
						class="slds-var-p-horizontal_small">
						<div class="slds-form-element">
							<label class="slds-form-element__label slds-no-flex">
								Price
							</label>
							<div class="slds-text-heading_small">
								<lightning-formatted-number 
									format-style="currency"
									currency-code="USD"
									value={_product.listPrice}
									></lightning-formatted-number>
							</div>
						</div>
					</lightning-layout-item>
					<lightning-layout-item size="12"
						medium-device-size="6"
						class="slds-var-p-horizontal_small">
						<div class="slds-form-element">
							<label class="slds-form-element__label slds-no-flex">
								Total
							</label>
							<div class="slds-text-heading_small">
								<lightning-formatted-number 
									format-style="currency"
									currency-code="USD"
									value={_product.totalPrice}
									></lightning-formatted-number>
							</div>
						</div>
					</lightning-layout-item>
				</lightning-layout>
			</lightning-layout-item>
		</lightning-layout>
		<div class="slds-border_top">
			<lightning-textarea lwc:if={showNotes}
				label="Notes"
				value={_product.notes}
				data-src="product"
				data-field="notes"
				data-type="string"
				onblur={handleFieldChange}
				class="slds-var-m-bottom_small"></lightning-textarea>
			<lightning-button lwc:else
				label="Add Notes"
				variant="base"
				onclick={handleOnAddNotesClick}
				class="slds-var-m-bottom_small"></lightning-button>
		</div>
		<div lwc:if={_product.hasParts}
			title={_product.parentItemProductName}
			class="slds-border_top">
			<lightning-button lwc:if={_product.showParts}
				variant="base"
				label="Parts"
				title="Hide Parts"
				icon-name="utility:chevrondown"
				onclick={handleOnShowPartsToggleClick}></lightning-button>
			<lightning-button lwc:else
				variant="base"
				label="Parts"
				title="Show Parts"
				icon-name="utility:chevronright"
				onclick={handleOnShowPartsToggleClick}></lightning-button>
		</div>
		<c-error-panel lwc:if={_product.hasError}
			error-title={_product.errorMessage}
			error-object={_product.errorObject}
			variant="compact"></c-error-panel>
	</div>
	<div class="slds-media__figure slds-media__figure_reverse">
		<!-- <div lwc:if={isDeleting}
			class="delete-panel
				slds-panel
				slds-panel_docked
				slds-panel_docked-right
				slds-is-open
				slds-is-absolute">
			<div class="slds-panel__body">
				<lightning-layout>
					<lightning-layout-item
						class="slds-var-m-right_small">
						<p>Are you sure?</p>
					</lightning-layout-item>
					<lightning-layout-item
						class="slds-border_left slds-var-p-left_small">
						<div class="slds-var-m-bottom_xxx-small">
							<lightning-button label="Yes, Delete"
								variant="destructive"
								onclick={handleOnConfirmDeleteProductClick}
								></lightning-button>
						</div>
						<div class="slds-var-m-bottom_xxx-small">
							<lightning-button label="No, Cancel"
								variant="brand-outline"
								onclick={handleOnCancelDeleteProductClic}
								></lightning-button>
						</div>
					</lightning-layout-item>
				</lightning-layout>
			</div>
		</div> -->
		<lightning-button-group lwc:if={showDeleteButton}>
			<lightning-button-icon
				icon-name="utility:delete"
				title="Remove Product From Current Order"
				disabled={_product.isDisabled}
				onclick={handleOnDeleteProductClick}></lightning-button-icon>

			<lightning-button-menu lwc:if={showCreateWorkOrderButton}
				alternative-text="Show menu"
				onselect={handleOnMenuSelect}
				menu-alignment="right">
				<template lwc:if={_product.isNew}></template>
				<lightning-menu-item lwc:else
					value="createWorkOrder"
					label="Create Work Order"
					prefix-icon-name="utility:new"></lightning-menu-item>
			</lightning-button-menu>
		</lightning-button-group>
	</div>
</div>
</template>
