<template>
<div class="slds-media
		slds-media_center
		slds-border_bottom
		slds-var-p-left_x-small
		slds-var-p-vertical_x-small">
	<div class="slds-media__body">
		<lightning-layout vertical-align="stretch"
			multiple-rows="true">
			<ul class="slds-list_horizontal
					slds-has-dividers_left
					list-item-horizontal">
				<li class="slds-item">
					<a href="#"
						onclick={handleOnOrderClick}
						class="">{_product.orderNumber}</a>
				</li>
				<li lwc:if={showDeliveryGroup}
					class="slds-item">
					<span class="slds-text-color_weak
						slds-var-m-right_small">Delivery Group</span>
					<a href="#"
						onclick={handleOnGroupClick}
						class="">{_product.groupName}</a>
				</li>
				<li class="slds-item">
					{_product.description}
				</li>
				<li lwc:if={showQty}
					class="slds-item">
					<span class="slds-text-color_weak
						slds-var-m-right_small">Qty</span>
					<span class="">{_product.qty}</span>
				</li>
			</ul>
		</lightning-layout>
	</div>
	<div lwc:if={_product.workOrderStatus}
		class="slds-media__figure_reverse">
		<c-status-indicator status={_product.workOrderStatus}>
		</c-status-indicator>
	</div>
</div>
</template>
