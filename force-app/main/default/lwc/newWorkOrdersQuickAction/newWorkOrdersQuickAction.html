<template>
<lightning-quick-action-panel header="Create Work Orders">
	<c-new-work-orders order-id={recordId}
		oncreatenewworkorderscomplete={handleOnComplete}></c-new-work-orders>

	<div slot="footer">
		<template lwc:if={isComplete}>
			<lightning-button
				variant="neutral"
				label="Close"
				onclick={handleOnCancelClick}
				class="slds-m-left_x-small"></lightning-button>
		</template>
		<template lwc:else>
			<lightning-button
				variant="neutral"
				label="Cancel"
				onclick={handleOnCancelClick}
				class="slds-m-left_x-small"></lightning-button>

			<lightning-button
				variant="brand"
				label="Submit"
				onclick={handleOnSubmitClick}
				class="slds-m-left_x-small"></lightning-button>
		</template>
	</div>
</lightning-quick-action-panel>
</template>
