<template>
<lightning-card title={title}>
<lightning-radio-group slot="actions"
	name="modeRadioGroup"
	alternative-text="Mode"
	options={modeOptions}
	value={mode}
	type="button"
	variant="label-hidden"
	onchange={handleModeChange}></lightning-radio-group>
<div class="slds-var-p-horizontal_small">
	<div lwc:if={hasError}>
		<c-error-panel error-title={errorTitle}
			error-object={errorObject}></c-error-panel>
	</div>
	<template lwc:if={hasItems}>
	<div for:each={items}
		for:item="item"
		for:index="index"
		key={item.uniqueId}
		class="slds-var-m-bottom_xx-small
			slds-is-relative">
		<template lwc:if={isAdmin}>
			<button lwc:if={index}
				title={labels.orderItemBtn}
				data-index={index}
				onclick={handleSwitchItemsOrderClick}
				class="switch-btn
					slds-button
					slds-button_icon
					slds-button_icon-border-filled
					slds-button_icon-small
					slds-is-absolute">
				<c-font-awesome-icon icon-name="solid:arrows-up-down"
					size="x-small"
					variant="inherit">
					<label>{labels.orderItemBt}</label>
				</c-font-awesome-icon>
			</button>
		</template>
		<c-line-item-manager-step item={item}
			preview-procedure-options={procedureOptions}
			mode={mode}
			data-index={index}
			procedure-options={procedureOptions}
			onitemchange={handleItemChange}
			onitemdelete={handleItemDelete}></c-line-item-manager-step>
	</div>
	</template>
	<template lwc:else>
		<c-illustration variant="no-task"
			image-size=""
			message={labels.noItemsMsg}></c-illustration>
	</template>
	<div lwc:if={isAdmin}
		class="slds-var-m-top_medium">
		<lightning-button label={labels.addItemBtn}
			icon-name="utility:add"
			stretch="true"
			onclick={handleAddItemClick}></lightning-button>
	</div>
</div>
</lightning-card>
</template>
