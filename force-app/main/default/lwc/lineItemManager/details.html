<template>
<lightning-card hide-header="true">
<div class="slds-scrollable_x slds-var-p-horizontal_small">
	<div lwc:if={hasError}>
		<c-error-panel error-title={errorTitle}
			error-object={errorObject}></c-error-panel>
	</div>
	<lightning-layout lwc:if={hasItems}>
		<lightning-layout-item for:each={items}
			for:item="item"
			for:index="index"
			key={item.uniqueId}
			class="slds-var-m-left_x-small
				slds-var-m-bottom_x-small
				slds-is-relative">
			<!-- <template lwc:if={isAdmin}>
				<button lwc:if={index}
					title={labels.orderItemBtn}
					data-index={index}
					onclick={handleSwitchItemsOrderClick}
					class="switch-btn
						slds-button
						slds-button_icon
						slds-button_icon-border-filled
						slds-button_icon-small
						slds-is-absolute">
					<c-font-awesome-icon icon-name="solid:arrows-left-right"
						size="x-small"
						variant="inherit">
						<label>{labels.orderItemBt}</label>
					</c-font-awesome-icon>
				</button>
			</template> -->
			<c-line-item-manager-step item={item}
				preview-procedure-options={procedureOptions}
				mode={mode}
				variant={variant}
				data-index={index}
				procedure-options={procedureOptions}
				status-options={statusOptions}
				onitemchange={handleItemChange}
				onitemdelete={handleItemDelete}></c-line-item-manager-step>
		</lightning-layout-item>
		<lightning-layout-item lwc:if={isAdmin}
			class="slds-var-m-left_x-small
				slds-var-m-bottom_x-small
				slds-is-relative">
			<lightning-button label={labels.addItemBtn}
				icon-name="utility:add"
				stretch="true"
				onclick={handleAddItemClick}></lightning-button>
		</lightning-layout-item>
	</lightning-layout>
	<template lwc:else>
		<c-illustration variant="no-task"
			image-size=""
			message={labels.noItemsMsg}></c-illustration>
		<div lwc:if={isAdmin}
			class="slds-text-align_center">
			<lightning-button label={labels.addItemBtn}
				icon-name="utility:add"
				variant="brand"
				onclick={handleAddItemClick}></lightning-button>
		</div>
	</template>
</div>
</lightning-card>
</template>
