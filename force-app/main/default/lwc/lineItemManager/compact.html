<template>
<div class="slds-var-p-horizontal_small">
	<lightning-layout lwc:if={hasItems}
		multiple-rows="true">
		<lightning-layout-item for:each={items}
			for:item="item"
			for:index="index"
			key={item.uniqueId}
			class="slds-var-m-right_large
				slds-var-m-vertical_xx-small
				slds-is-relative">
			<c-line-item-manager-step item={item}
				preview-procedure-options={procedureOptions}
				mode={mode}
				variant={variant}
				data-index={index}
				procedure-options={procedureOptions}
				status-options={statusOptions}
				onitemchange={handleItemChange}
				onitemdelete={handleItemDelete}></c-line-item-manager-step>
		</lightning-layout-item>
		<!-- <lightning-layout-item lwc:if={showDetailActions}
			alignment-bump="left">
			<lightning-button lwc:if={isSelectedItemInProgress}
				label="Complete Step"
				name="completeStep"
				alternative-text="Complete Step"
				variant="brand"
				stretch="true"
				onclick={handleOnCompleteStepClick}></lightning-button>
			<lightning-button lwc:else
				label="Set As Current Step"
				name="setAsCurrentStep"
				alternative-text="Set As Current Step"
				variant="outline"
				stretch="true"
				onclick={handleOnSetAsCurrentStepClick}></lightning-button>
		</lightning-layout-item> -->
	</lightning-layout>
	<div lwc:if={hasError}>
		<c-error-panel error-title={errorTitle}
			error-object={errorObject}></c-error-panel>
	</div>
</div>
</template>
