<template>
<div class="slds-combobox_container">
	<div class="slds-combobox
			slds-dropdown-trigger
			slds-dropdown-trigger_click
			slds-is-open">
		<lightning-input type="text"
			name={name}
			label={label}
			value={value}
			onblur={handleOnBlur}
			onchange={handleOnChange}
			autocomplete="off"
			required={required}></lightning-input>
		<div lwc:if={showDropdown}
			class="custom-dropdown
				slds-dropdown
				slds-m-around_none"
			role="listbox"
			aria-label="Suggestions"
			tabindex="0"
			aria-busy="false">
			<ul class="slds-listbox slds-listbox_vertical"
				role="presentation">
				<li for:each={dropdownOptions}
					for:item="option"
					for:index="index"
					key={option}
					role="presentation"
					class="slds-listbox__item">
					<div data-index={index}
						onclick={handleOnSuggestionClick}
						class="slds-media
							slds-media_center
							slds-media_small
							slds-listbox__option
							slds-listbox__option_plain
							custom-listbox__option_plain"
						role="option">
						<span class="slds-media__body">
							<span class="slds-truncate"
								title={option}>{option}</span>
						</span>
						<span class="slds-media__figure
								slds-media__figure_reverse
								slds-listbox__option-icon">
							<lightning-icon icon-name="utility:arrowup"
								size="x-small"></lightning-icon>
						</span>
					</div>
				</li>
			</ul>
		</div>
	</div>
</div>
</template>
