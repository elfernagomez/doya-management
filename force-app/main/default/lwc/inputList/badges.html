<template>
<div lwc:if={isView}
	class="">
	<div lwc:if={items.length}>
		<c-badge for:each={items}
			for:item="item"
			for:index="index"
			key={item}
			icon-position="none"
			class="slds-var-m-right_small">
			<span slot="body">{item}</span>
		</c-badge>
	</div>
	<p lwc:else
		class="slds-var-p-horizontal_small
			slds-text-color_inverse-weak">{noItemsMessage}</p>
</div>
<div lwc:if={isEdit}
	class="slds-box slds-box_xx-small">
	<lightning-layout class="slds-var-m-bottom_xx-small">
		<lightning-layout-item flexibility="grow">
			<div>
				<c-badge for:each={items}
					for:item="item"
					for:index="index"
					key={item}
					icon-position="right"
					class="slds-var-m-right_small">
					<lightning-icon icon-name="utility:close"
						size="x-small"
						class="slds-m-right_xx-small"
						slot="iconRight"
						data-index={index}
						onclick={handleOnDeleteItemClick}></lightning-icon>
					<span slot="body">{item}</span>
				</c-badge>
				<div class="slds-is-relative
						slds-show_inline-block">
					<lightning-input name="newElement"
						variant="label-hidden"
						value={newValue}
						maxlength="80"
						onchange={handleOnNewValueChange}
						onkeypress={handleOnNewValueKeyPress}
						placeholder="Add item..."
						class="newElementInput "></lightning-input>
					<lightning-button-icon icon-name="utility:add"
						variant="container"
						disabled={isAddBtnDisabled}
						onclick={handleOnAddClick}
						class="slds-is-absolute"
						style="right:0;top:0;"></lightning-button-icon>
				</div>
			</div>
		</lightning-layout-item>
		<lightning-layout-item>
			<lightning-button-group>
				<lightning-button-icon-stateful
					for:each={orderingTypeOptions}
					for:item="option"
					for:index="index"
					key={option.value}
					size="small"
					icon-name={option.iconName}
					selected={option.isSelected}
					data-value={option.value}
					onclick={handleSortOptionClick}
					alternative-text={option.label}></lightning-button-icon-stateful>
			</lightning-button-group>
		</lightning-layout-item>
	</lightning-layout>
