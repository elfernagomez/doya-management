<template>
<!-- heads -->
<div lwc:if={isError}>
	<c-error-panel error-title={errorTitle}
		error-object={errorObject}
		variant="confy"></c-error-panel>
</div>
<!-- heads -->
<div class="slds-table
		slds-table_cell-buffer
		slds-is-relative">
	<template for:each={data}
		for:item="row"
		for:index="i">
	<lightning-layout vertical-align="stretch"
		key={row.uniqueId}
		class="neutral-65
			slds-border_bottom">
		<lightning-layout-item size="8">
			<lightning-layout vertical-align="center"
				class="full-height">
				<lightning-layout-item role="gridcell"
					style={rowNumberColumnStyle}
					class="slds-cell_action-mode neutral-65">
					<div class="slds-var-p-vertical_xx-small
							slds-var-p-horizontal_small
							slds-text-align_center">{row.rowNumber}</div>
				</lightning-layout-item>
				<lightning-layout-item role="gridcell"
					flexibility="no-flex"
					style="width:32px;"
					class="slds-text-align_right
						slds-cell_action-mode">
					<div class="slds-var-p-vertical_xx-small
							slds-var-p-horizontal_small">
						<div class="slds-checkbox">
							<lightning-input type="checkbox"
								variant="label-hidden"
								value={row.isSelected}
								checked={row.isSelected}
								data-index={i}
								onchange={handleOnSelectRowChange}></lightning-input>
						</div>
					</div>
				</lightning-layout-item>
				<lightning-layout-item role="gridcell"
					for:each={row.columns}
					for:item="col"
					for:index="j"
					key={col.key}
					title={col.column.label}
					style={col.column.styles.cell.style}
					class={col.column.styles.cell.class}>
					<div class="slds-var-p-vertical_xx-small
							slds-var-p-horizontal_small">
						<c-output-field record={row.data}
							object-api-name={objectApiName}
							is-name-field={col.column.isNameField}
							field-name={col.column.fieldName}
							field-type={col.column.fieldType}
							relationship-name={col.column.relationshipName}
							related-to={col.column.relatedTo}
							maximum-fraction-digits={col.column.maxFrac}
							minimum-fraction-digits={col.column.minFrac}
							minimum-integer-digits={col.column.minInt}
							type={col.column.type}></c-output-field>
					</div>
				</lightning-layout-item>
			</lightning-layout>
		</lightning-layout-item>
		<lightning-layout-item size="4"
			class="slds-theme_default">
			<div class="slds-media
					slds-media_center
					slds-var-p-around_medium
					full-height">
				<div class="slds-media__body">
					<c-work-order-line-item-manager
						variant="compact"
						data-index={i}
						record-id={row.uniqueId}
						onitemselected={handleOnLineItemSelected}
						selected-item-id={row.selectedItemId}
						></c-work-order-line-item-manager>
				</div>
				<div class="slds-media__figure
						slds-media__figure_reverse">
					<lightning-button-icon lwc:if={row.isOpen}
						size="medium"
						icon-name="utility:chevronup"
						alternative-text="Close Details"
						title="Close Details"
						variant="bare"
						data-index={i}
						onclick={handleOnCloseRowClick}></lightning-button-icon>
					<lightning-button-icon lwc:else
						size="medium"
						icon-name="utility:chevrondown"
						alternative-text="Open Details"
						title="Open Details"
						variant="bare"
						data-index={i}
						onclick={handleOnOpenRowClick}></lightning-button-icon>
				</div>
			</div>
		</lightning-layout-item>
	</lightning-layout>
	<div lwc:if={row.isOpen}
		key={row.uniqueId}
		class="slds-border_bottom">
		<div lwc:if={row.selectedItemId}
			class="slds-var-p-around_large">
			<c-work-order-single-line-item-manager
				variant="fields"
				data-index={i}
				record-id={row.selectedItemId}
				></c-work-order-single-line-item-manager>
		</div>
		<lightning-layout lwc:else
			horizontal-align="center">
			<lightning-layout-item padding="around-medium">
				<div class="slds-media slds-media_center">
					<div class="slds-media__figure">
						<lightning-icon icon-name="utility:button_choice"
							size="x-small"></lightning-icon>
					</div>
					<p class="slds-text-color_weak">
						No selection. Select an item
						to view its details here.
					</p>
				</div>
			</lightning-layout-item>
			
		</lightning-layout>
	</div>
	</template>
	<lightning-spinner lwc:if={isLoading}></lightning-spinner>
</div>
</template>
