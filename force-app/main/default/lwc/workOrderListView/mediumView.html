<template>
<!-- heads -->
<div lwc:if={isError}>
	<c-error-panel error-title={errorTitle}
		error-object={errorObject}
		variant="confy"></c-error-panel>
</div>
<!-- body -->
<div class="">
<template lwc:if={hasRecords}>
<div for:each={data}
	for:item="row"
	for:index="i"
	key={row.uniqueId}
	class="slds-box
		slds-theme_shade
		slds-var-m-bottom_small
		slds-p-around_none">
	<div class="slds-page-header"
		style="background:none;">
		<div class="slds-page-header__row">
			<div class="slds-page-header__col-title">
				<div class="slds-media">
					<div class="slds-media__figure">
						<lightning-icon icon-name={iconName}
							alternative-text="Work Order"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<template for:each={row.mediumTopColumns}
							for:item="col"
							for:index="j">
							<span lwc:if={j} key={col.key}></span>
							<div lwc:else
								key={col.key}
								class="slds-page-header__name">
								<div class="slds-page-header__name-title">
									<h1><span class="slds-page-header__title
										slds-truncate">
									<c-output-field record={row.data}
										object-api-name={objectApiName}
										is-name-field={col.column.isNameField}
										field-name={col.column.fieldName}
										field-type={col.column.fieldType}
										relationship-name={col.column.relationshipName}
										related-to={col.column.relatedTo}
										maximum-fraction-digits={col.column.maxFrac}
										minimum-fraction-digits={col.column.minFrac}
										minimum-integer-digits={col.column.minInt}
										type={col.column.type}></c-output-field>
									</span></h1>
								</div>
							</div>
						</template>
						<div class="slds-page-header__name-meta">
							<ul class="slds-list_horizontal slds-has-dividers_left">
							<template for:each={row.mediumTopColumns}
								for:item="col"
								for:index="j">
								<template lwc:if={j}>
								<li lwc:if={col.isNotBlank}
									key={col.key}
									class="slds-item">
									<c-output-field record={row.data}
										object-api-name={objectApiName}
										is-name-field={col.column.isNameField}
										field-name={col.column.fieldName}
										field-type={col.column.fieldType}
										relationship-name={col.column.relationshipName}
										related-to={col.column.relatedTo}
										maximum-fraction-digits={col.column.maxFrac}
										minimum-fraction-digits={col.column.minFrac}
										minimum-integer-digits={col.column.minInt}
										type={col.column.type}></c-output-field>
								</li>
								</template>
							</template>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="slds-page-header__col-actions">
				<div class="slds-page-header__controls">
					<div class="slds-page-header__control">
						<c-status-indicator
							status={row.status}></c-status-indicator>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="slds-var-p-horizontal_large slds-var-p-bottom_large">
		<lightning-layout vertical-align="stretch"
			multiple-rows="true"
			class="slds-box
				slds-box_x-small
				slds-theme_default">
			<lightning-layout-item size="12">
				<lightning-layout multiple-rows="true">
					<lightning-layout-item
						for:each={row.mediumBottomColumns}
						for:item="col"
						for:index="j"
						key={col.key}
						title={col.column.label}
						size="2"
						style={col.column.styles.cell.style}
						class={col.column.styles.cell.class}>
						<div class="slds-form-element">
							<label class="slds-form-element__label">
								{col.column.label}&nbsp;</label>
							<div class="slds-form-element__control">
								<c-output-field record={row.data}
									object-api-name={objectApiName}
									is-name-field={col.column.isNameField}
									field-name={col.column.fieldName}
									field-type={col.column.fieldType}
									relationship-name={col.column.relationshipName}
									related-to={col.column.relatedTo}
									maximum-fraction-digits={col.column.maxFrac}
									minimum-fraction-digits={col.column.minFrac}
									minimum-integer-digits={col.column.minInt}
									type={col.column.type}></c-output-field>
							</div>
						</div>
					</lightning-layout-item>
				</lightning-layout>
			</lightning-layout-item>
			<lightning-layout-item size="12"
				class="slds-border_top slds-var-m-top_small">
				<div class="slds-media slds-media_center slds-var-p-top_small">
					<div class="slds-media__body">
						<c-work-order-line-item-manager
							variant="compact"
							data-index={i}
							record-id={row.uniqueId}
							onitemselected={handleOnLineItemSelected}
							selected-item-id={row.selectedItemId}
							></c-work-order-line-item-manager>
					</div>
					<div class="slds-media__figure
							slds-media__figure_reverse">
						<lightning-button-icon lwc:if={row.isOpen}
							size="medium"
							icon-name="utility:chevronup"
							alternative-text="Close Details"
							title="Close Details"
							variant="bare"
							data-index={i}
							onclick={handleOnCloseRowClick}></lightning-button-icon>
						<lightning-button-icon lwc:else
							size="medium"
							icon-name="utility:chevrondown"
							alternative-text="Open Details"
							title="Open Details"
							variant="bare"
							data-index={i}
							onclick={handleOnOpenRowClick}></lightning-button-icon>
					</div>
				</div>
			</lightning-layout-item>
			<lightning-layout-item size="12"
				lwc:if={row.isOpen}
				class="slds-border_top slds-var-m-top_small slds-var-p-top_small">
				<div class="custom-tabset custom-tabset-horizontal">
					<div class="custom-tablist"
						role="tablist"
						aria-orientation="vertical">
						<button type="button"
							role="tab"
							class={row.orderProductsTabClass}
							data-index={i}
							onclick={handleOnOrderProductsTabActive}>
							{row.orderProductsButtonLabel}
						</button>
						<button type="button"
							role="tab"
							class={row.stepDetailsTabClass}
							data-index={i}
							onclick={handleOnStepDetailsTabActive}>
							Step Details
						</button>
						<button lwc:if={row.hasFiles}
							type="button"
							role="tab"
							class={row.filesTabClass}
							data-index={i}
							onclick={handleOnFilesTabActive}>
							{row.filesTabLabel}
						</button>
					</div>
					<div class="custom-tabpanel"
						role="tabpanel">
						<div lwc:if={row.isOrderProductsTabActive}
							class="slds-var-p-horizontal_small">
							<c-product-manager lwc:if={row.hasOrderProducts}
								products={row.orderProducts}
								mode="view"
								variant="list-item"
								hide-add-products=true></c-product-manager>
						</div>
						<div lwc:if={row.isStepDetailsTabActive}
							class="slds-var-p-horizontal_small">
							<c-work-order-single-line-item-manager
								variant="fields"
								data-index={i}
								record-id={row.selectedItemId}
								></c-work-order-single-line-item-manager>
						</div>
						<div lwc:if={row.isFilesTabActive}
							class="slds-var-p-horizontal_small">
							<c-work-order-files-list
								record-id={row.uniqueId}></c-work-order-files-list>
						</div>
					</div>
				</div>
			</lightning-layout-item>
		</lightning-layout>
		<!-- <lightning-layout lwc:if={row.hasOrderProducts}
			vertical-align="stretch"
			multiple-rows="true"
			class="slds-box
				slds-p-around_none
				slds-theme_default
				slds-var-m-top_medium">
			<lightning-layout-item size="12">
				<lightning-button lwc:if={row.showOrderProducts}
					label={row.orderProductsButtonLabel}
					variant="base"
					stretch="true"
					icon-name="utility:chevronup"
					icon-position="right"
					data-index={i}
					record-id={row.uniqueId}
					onclick={handleOnOrderProductLinkClick}></lightning-button>
				<lightning-button lwc:else
					label={row.orderProductsButtonLabel}
					variant="base"
					stretch="true"
					icon-name="utility:chevrondown"
					icon-position="right"
					data-index={i}
					record-id={row.uniqueId}
					onclick={handleOnOrderProductLinkClick}></lightning-button>
			</lightning-layout-item>
			<lightning-layout-item lwc:if={row.showOrderProducts}
				size="12"
				class="slds-var-p-around_small">
				<c-product-manager products={row.orderProducts}
					mode="view"
					variant="list-item"
					hide-add-products=true></c-product-manager>
			</lightning-layout-item>
		</lightning-layout> -->
	</div>
</div>
</template>
<div lwc:else>
	<p class="slds-text-align_center
			slds-text-color_weak
			slds-p-around_large
			slds-var-m-top_small">
		No Work Orders yet.
	</p>
</div>
<lightning-spinner lwc:if={isLoading}></lightning-spinner>
</div>
</template>
