<template>
<div lwc:if={isView}
	class="slds-is-relative
		slds-box
		slds-box_xx-small
		slds-media
		slds-media_small
		slds-var-p-around_medium
		slds-theme_default">
	<div class="slds-media__body">
		<div class="slds-media
				slds-media_small
				slds-is-relative">
			<div class="slds-media__body slds-var-p-horizontal_small">
				<lightning-layout vertical-align="center"
					multiple-rows="true">
					<lightning-layout-item size="12"
						large-device-size="3"
						class="slds-var-p-right_small">
						<div class="slds-media slds-media_small">
							<div class="slds-media__figure">
								<lightning-icon lwc:if={_discount.isPercentage}
									icon-name="utility:percent"
									title={_discount.productName}
									size="x-small"></lightning-icon>
								<lightning-icon lwc:if={_discount.isFixed}
									icon-name="utility:moneybag"
									title={_discount.productName}
									size="x-small"></lightning-icon>
							</div>
							<div class="slds-media__body">
								<h3 title={_discount.productName}>
									<b>{_discount.productName}</b>
								</h3>
								<p class="slds-text-body_small">
									{_discount.productCode}
								</p>
							</div>
						</div>
					</lightning-layout-item>
					<lightning-layout-item
						flexibility="grow"
						class="slds-border_left
							slds-var-p-horizontal_large">
						<lightning-layout multiple-rows="true">
							<lightning-layout-item class="slds-var-m-right_xx-large">
								<div class="slds-form-element">
									<label class="slds-form-element__label slds-p-top_none">
										Discount Type
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											{_discount.discountType}&nbsp;
										</div>
									</div>
								</div>
							</lightning-layout-item>
							<lightning-layout-item class="slds-var-m-right_xx-large">
								<div class="slds-form-element">
									<label class="slds-form-element__label slds-p-top_none">
										Discount Amount
									</label>
									<div class="slds-form-element__control">
										<div class="slds-form-element__static">
											<lightning-formatted-number
												lwc:if={_discount.isPercentage}
												format-style="percent"
												maximum-fraction-digits="2"
												value={percentage}
												></lightning-formatted-number>&nbsp;
											<lightning-formatted-number
												lwc:if={_discount.isFixed}
												format-style="currency"
												maximum-fraction-digits="2"
												value={_discount.discountAmount}
												></lightning-formatted-number>&nbsp;
										</div>
									</div>
								</div>
							</lightning-layout-item>
						</lightning-layout>
					</lightning-layout-item>
					<lightning-layout-item 
						class="slds-border_left"
						style="min-width:12rem;">
						<lightning-layout multiple-rows="true"
							horizontal-align="end">
							<lightning-layout-item size="6"
								class="slds-var-p-horizontal_small">
								<div class="slds-form-element">
									<label class="slds-form-element__label slds-no-flex">
										Total
									</label>
									<div class="slds-text-heading_small">
										<lightning-formatted-number 
											format-style="currency"
											currency-code="USD"
											value={_discount.totalPrice}
											></lightning-formatted-number>
									</div>
								</div>
							</lightning-layout-item>
						</lightning-layout>
					</lightning-layout-item>
				</lightning-layout>
			</div>
		</div>
	</div>
	<div lwc:if={showDeleteButton}
		class="slds-media__figure slds-media__figure_reverse"
		style="margin-right:0!important;">
		<lightning-button-icon icon-name="utility:delete"
			title="Remove Discount From Current Order"
			disabled={_discount.isDisabled}
			onclick={handleOnDeleteDiscountClick}></lightning-button-icon>
	</div>
</div>
<div lwc:if={isEdit}
	class="slds-is-relative
		slds-box
		slds-box_xx-small
		slds-is-relative
		slds-media
		slds-media_small">
	<!-- <div class="slds-media__figure slds-var-p-vertical_xx-small">
		<lightning-button-icon icon-name="utility:drag_and_drop"
			variant="bare"
			small="small"
			class="slds-hidden"></lightning-button-icon>
	</div> -->
	<div class="slds-media__body">
		<lightning-layout vertical-align="stretch">
			<lightning-layout-item size="3"
				class="slds-var-p-vertical_xx-small
					slds-var-p-right_small">
				<div class="slds-media slds-media_small">
					<div class="slds-media__figure">
						<lightning-icon lwc:if={_discount.isPercentage}
							icon-name="utility:percent"
							title={_discount.productName}
							size="x-small"></lightning-icon>
						<lightning-icon lwc:if={_discount.isFixed}
							icon-name="utility:moneybag"
							title={_discount.productName}
							size="x-small"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<h3 title={_discount.productName}>
							<b>{_discount.productName}</b>
						</h3>
						<p class="slds-text-body_small">
							{_discount.productCode}
						</p>
					</div>
				</div>
			</lightning-layout-item>
			<lightning-layout-item flexibility="grow"
				class="slds-var-p-horizontal_small">
				<lightning-layout multiple-rows="true">
					<lightning-layout-item>
						<lightning-select label="Discount Type"
							disabled={_discount.isDisabled}
							options={discountTypeOptions}
							type="button"
							value={_discount.discountType}
							variant="label-stacked"
							data-src="discount"
							data-field="discountType"
							data-type="string"
							onchange={handleFieldChange}
							class="medium-row"></lightning-select>
					</lightning-layout-item>
					<lightning-layout-item>
						<lightning-input type={inputType}
							label="Discount Amount"
							disabled={_discount.isDisabled}
							value={_discount.discountAmount}
							variant="label-stacked"
							data-src="discount"
							data-field="discountAmount"
							data-type="float"
							onchange={handleFieldChange}
							class="medium-row"></lightning-input>
					</lightning-layout-item>
				</lightning-layout>
			</lightning-layout-item>
			<lightning-layout-item style="min-width:12rem;">
				<lightning-layout multiple-rows="true"
					horizontal-align="end">
					<lightning-layout-item size="6"
						class="slds-var-p-horizontal_small">
						<div class="slds-form-element">
							<label class="slds-form-element__label slds-no-flex">
								Total
							</label>
							<div class="slds-text-heading_small">
								<lightning-formatted-number 
									format-style="currency"
									currency-code="USD"
									value={_discount.totalPrice}
									></lightning-formatted-number>
							</div>
						</div>
					</lightning-layout-item>
				</lightning-layout>
			</lightning-layout-item>
		</lightning-layout>
		<c-error-panel lwc:if={_discount.hasError}
			error-title={_discount.errorMessage}
			error-object={_discount.errorObject}
			variant="compact"></c-error-panel>
	</div>
	<div class="slds-media__figure slds-media__figure_reverse">
		<!-- <div lwc:if={isDeleting}
			class="delete-panel
				slds-panel
				slds-panel_docked
				slds-panel_docked-right
				slds-is-open
				slds-is-absolute">
			<div class="slds-panel__body">
				<lightning-layout>
					<lightning-layout-item
						class="slds-var-m-right_small">
						<p>Are you sure?</p>
					</lightning-layout-item>
					<lightning-layout-item
						class="slds-border_left slds-var-p-left_small">
						<div class="slds-var-m-bottom_xxx-small">
							<lightning-button label="Yes, Delete"
								variant="destructive"
								onclick={handleOnConfirmDeleteDiscountClick}
								></lightning-button>
						</div>
						<div class="slds-var-m-bottom_xxx-small">
							<lightning-button label="No, Cancel"
								variant="brand-outline"
								onclick={handleOnCancelDeleteDiscountClic}
								></lightning-button>
						</div>
					</lightning-layout-item>
				</lightning-layout>
			</div>
		</div> -->
		<lightning-button-icon lwc:if={showDeleteButton}
			icon-name="utility:delete"
			title="Remove Discount From Current Order"
			disabled={_discount.isDisabled}
			onclick={handleOnDeleteDiscountClick}></lightning-button-icon>
	</div>
</div>
</template>
