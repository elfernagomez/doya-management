<div class="slds-card__body slds-card__body_inner">
<template lwc:if={isLoading}>
	<div class="slds-text-align_center slds-p-around_medium">
		<lightning-spinner alternative-text="Loading"
			size="small"></lightning-spinner>
	</div>
</template>

<template lwc:if={error}>
	<div class="slds-text-color_error slds-p-around_medium">
		Error loading packing slips: {error}
	</div>
</template>

<div lwc:if={isDeliveredOrBeyond}
	class="slds-var-m-bottom_small">
	<c-scoped-notification
		message={labels.readOnlyCompletedMessage}
		variant="warning"></c-scoped-notification>
</div>

<lightning-layout>
	<lightning-layout-item flexibility="grow">
		<lightning-input type="search"
			name="searchSlips"
			variant="label-hidden"
			placeholder="Search Packing Slips..."
			onchange={handleOnSearchSlipsChange}></lightning-input>
	</lightning-layout-item>
	<lightning-layout-item>
		<lightning-layout>
			<lightning-button-group>
				<template lwc:if={showModeButtons}>
					<template for:each={modeOptions}
						for:item="modeOption"
						for:index="index">
						<lightning-button lwc:if={modeOption.isNotChecked}
							icon-name={modeOption.iconName}
							key={modeOption.value}
							data-value={modeOption.value}
							label={modeOption.label}
							onclick={handleOnModeClick}></lightning-button>
					</template>
				</template>
			</lightning-button-group>
		</lightning-layout>
	</lightning-layout-item>
	<lightning-layout-item lwc:if={showModeButtons}
		class="slds-var-m-left_small">
		<template for:each={modeOptions}
			for:item="modeOption"
			for:index="index">
			<lightning-button lwc:if={modeOption.isNotChecked}
				icon-name={modeOption.iconName}
				key={modeOption.value}
				data-value={modeOption.value}
				label={modeOption.label}
				onclick={handleOnModeClick}></lightning-button>
		</template>
	</lightning-layout-item>
</lightning-layout>

<div lwc:if={hasGroups}
	class="slds-var-m-top_small">
	<div for:each={groups}
		for:item="group"
		key={group.uniqueId}
		class="slds-var-m-bottom_small">
		<c-delivery-group-card delivery-group={group}
			mode="view"
			hide-details-button=true
			custom-actions={deliveryGroupCardCustomActions}
			oncustomactionclick={handleOnGroupCustomActionClick}>
			<div for:each={group.slips}
				for:item="packingSlip"
				for:index="index"
				key={packingSlip.uniqueId}>
				<c-packing-slip-item-editor
					record-id={packingSlip.uniqueId}
					mode="view"
					view-custom-actions={packingSlipCardCustomActions}
					onitemsaved={handleItemsSaved}
					onpackingslipcustomactionclick={handleOnPackingSlipCustomActionClick}></c-packing-slip-item-editor>
			</div>
		</c-delivery-group-card>
	</div>

</div>
<template lwc:else>
	<template lwc:if={isLoading}>
	</template>
	<template lwc:else>
		<div class="slds-text-align_center slds-text-color_weak
				slds-p-around_large slds-var-m-top_small">
			<p>Nothing to pack yet.</p>
		</div>
	</template>
</template>
</div>
	<template lwc:if={printPreviewUrl}>
		<iframe
			class="print-preview-frame"
			lwc:ref="printPreviewFrame"
			title="Packing slip print preview"
			onload={handlePrintPreviewLoad}
			src={printPreviewUrl}></iframe>
	</template>
</lightning-card>
