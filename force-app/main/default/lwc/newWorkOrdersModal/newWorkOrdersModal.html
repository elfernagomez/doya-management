<template>
<lightning-modal-header label="Create Work Orders"></lightning-modal-header>
<lightning-modal-body>
	<c-new-work-orders order-id={orderId}
		order-product-id={orderProductId}
		oncreatenewworkorderscomplete={handleOnComplete}></c-new-work-orders>
</lightning-modal-body>
<lightning-modal-footer>
	<template lwc:if={isComplete}>
			<lightning-button
				variant="neutral"
				label="Close"
				onclick={handleOnCancelClick}
				class="slds-m-left_x-small"></lightning-button>
		</template>
		<template lwc:else>
			<lightning-button
				variant="neutral"
				label="Cancel"
				onclick={handleOnCancelClick}
				class="slds-m-left_x-small"></lightning-button>

			<lightning-button
				variant="brand"
				label="Submit"
				onclick={handleOnSubmitClick}
				class="slds-m-left_x-small"></lightning-button>
		</template>
</lightning-modal-footer>
</template>
