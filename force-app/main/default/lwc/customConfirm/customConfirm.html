<template>
<lightning-modal-header label={title}></lightning-modal-header>
<lightning-modal-body>
	<lightning-formatted-rich-text 
		value={content}></lightning-formatted-rich-text>
</lightning-modal-body>
<lightning-modal-footer>
	<lightning-button for:each={buttons}
		for:item="btn"
		for:index="i"
		key={btn.name}
		name={btn.name}
		label={btn.label}
		variant={btn.variant}
		onclick={handleOnActionClick}
		class="slds-var-m-horizontal_x-small"></lightning-button>
</lightning-modal-footer>
</template>
