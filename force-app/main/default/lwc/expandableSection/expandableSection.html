<template>
	<section class={sectionClass}>
		<h3 class="slds-section__title">
			<button type="button"
				class="slds-button slds-section__title-action"
				aria-expanded={ariaExpanded}
				onclick={handleToggle}>
				<lightning-icon icon-name="utility:switch"
					size="xx-small"
					class="slds-section__title-action-icon slds-button__icon slds-button__icon_left">
				</lightning-icon>
				<span class="slds-truncate" title={displayHeading}>{displayHeading}</span>
			</button>
		</h3>

		<div class="slds-section__content" aria-hidden={ariaHidden}>
			<slot></slot>
		</div>
	</section>
</template>
