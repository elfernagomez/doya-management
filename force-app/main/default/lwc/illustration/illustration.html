<template> 
	<div class="slds-card__header slds-grid"
		lwc:if={action}>
		<header>
			<h2><slot name="header"></slot></h2>
		</header>
	</div>
	<div class={illustrationClass}>
		<c-illustration-svg lwc:if={showIllustration}
			variant={variant}></c-illustration-svg>

		<div class="slds-text-longform">
			<h3 class={headingClass}>{heading}</h3>
			<slot name="message">
				<p class="slds-text-body_regular">{message}</p>
			</slot>
		</div>
	</div>
	<div lwc:if={action}>
		<footer class="slds-card__footer">
			<slot name="footer"></slot>
		</footer>
	</div>
</template>
