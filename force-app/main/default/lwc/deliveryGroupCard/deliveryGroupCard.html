<template>
<div class="slds-box
		slds-theme_shade
		slds-p-around_none">
	<div class="slds-page-header"
		style="background:none;">
		<div class="slds-page-header__row">
			<div class="slds-page-header__col-title">
				<div class="slds-media">
					<div class="slds-media__figure">
						<lightning-icon icon-name={headerIconName}
							alternative-text="Delivery Group"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<div class="slds-page-header__name">
							<div class="slds-page-header__name-title">
								<h1><span class="slds-truncate
									slds-page-header__title">{group.name}</span></h1>
							</div>
						</div>
						<p lwc:if={group.isPlaceHolder}
							class="slds-page-header__name-meta">
							<span>Products not placed in a delivery group yet</span>
						</p>
						<div lwc:else
							class="slds-page-header__name-meta">
							<ul class="slds-list_horizontal slds-has-dividers_left">
								<li lwc:if={group.dueDate}
									class="slds-item">
									<lightning-formatted-date-time
										value={dueDateDisplayValue}
										year="numeric"
										month="numeric"
										day="numeric"></lightning-formatted-date-time>
								</li>
								<!-- <li lwc:if={group.createdDate}
									class="slds-item">
									<lightning-formatted-date-time
										value={group.createdDate}
										year="numeric"
										month="numeric"
										day="numeric"></lightning-formatted-date-time>
								</li> -->
								<li lwc:if={group.deliveryType}
									class="slds-item">{group.deliveryType}</li>
								<li lwc:if={group.addressLabel}
									class="slds-item">{group.addressLabel}</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="slds-page-header__col-actions">
				<div class="slds-page-header__controls">
					<div class="slds-page-header__control">
						<lightning-button-group>
							<lightning-button 
								for:each={customActions}
								for:item="a"
								for:index="i"
								title={a.label}
								label={a.label}
								key={a.value}
								icon-name={a.iconName}
								data-action-index={i}
								data-action-value={a.value}
								data-action-name={a.name}
								onclick={handleOnCustomActionClick}
								></lightning-button>
							<lightning-button lwc:if={showDetailsButton}
								label="Details"
								icon-name="utility:new_window"
								icon-position="right"
								onclick={handleOnOpenDetailsClick}
								></lightning-button>
							<lightning-button lwc:if={showCloneButton}
								label="Clone"
								onclick={handleOnCloneRequestClick}
								></lightning-button>
							<lightning-button-icon lwc:if={showDeleteButton}
								title="Delete"
								icon-name="utility:delete"
								variant="border-filled"
								onclick={handleOnStartDeleteClick}
								></lightning-button-icon>
						</lightning-button-group>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="slds-var-p-horizontal_large slds-var-p-bottom_large">
		<div lwc:if={isError}
			class="slds-var-m-bottom_small">
			<c-error-panel error-title={errorTitle}
				error-object={errorObject}></c-error-panel>
		</div>
		<slot></slot>
	</div>
</div>
<c-modal lwc:if={isEdit}
	size="small"
	disable-scrolling=true
	class="cloneModal">
	<div slot="header">
		Clone Group Details
	</div>
	<div slot="body"
		class="slds-var-p-around_xx-large slds-is-relative"
		style="min-height:8rem;">
		<div lwc:if={isError}
			class="slds-var-m-bottom_small">
			<c-error-panel error-title={errorTitle}
				error-object={errorObject}></c-error-panel>
		</div>
		<div role="list"
			class="slds-form">
			<div class="slds-form__row">
				<div role="listitem"
					class="slds-form__item slds-show">
					<lightning-input variant="label-stacked"
						label="New Delivery Group Name"
						value={clonedGroupName}
						required
						onchange={handleOnCloneFieldChange}
						class="cloneField slds-size_full"></lightning-input>
				</div>
			</div>
		</div>
		<lightning-spinner lwc:if={isLoading}
			variant="brand"></lightning-spinner>
	</div>
	<div slot="footer">
		<lightning-button label="Cancel"
			variant="neutral"
			type="cancel"
			disabled={isCancelButtonDisabled}
			onclick={handleOnCancelCloneClick}
			class="slds-var-m-horizontal_x-small"></lightning-button>

		<lightning-button label="Clone"
			variant="brand"
			disabled={isSaveButtonDisabled}
			onclick={handleOnCloneSubmit}
			class="slds-var-m-horizontal_x-small"></lightning-button>
	</div>
</c-modal>
</template>
