<template>
<lightning-card hide-header="true">
	<div lwc:if={isError}
		class="slds-var-p-horizontal_small">
		<c-error-panel error-title={errorTitle}
			error-object={errorObject}></c-error-panel>
	</div>
	<c-line-item-manager lwc:if={isReady}
		title="Steps"
		variant="details"
		details={details}
		status-options={statusOptions}
		selected-item-id={selectedItemId}
		onitemcreate={handleItemCreated}
		onitemchange={handleItemChange}
		onitemdelete={handleItemDelete}>
	</c-line-item-manager>
	<!-- <template lwc:if={isLoading}>
		<lightning-spinner variant="brand"
			alternative-text="Loading..."></lightning-spinner>
	</template> -->
</lightning-card>
</template>
