<template>
<lightning-card title={currentStepName}>
	<lightning-button-group slot="actions">
		<!-- <lightning-button-menu menu-alignment="right"
			onselect={handleOnModeSelect}>
			<lightning-menu-item for:each={modeOptions}
				for:item="modeOption"
				for:index="index"
				checked={modeOption.isChecked}
				key={modeOption.value}
				value={modeOption.value}
				label={modeOption.label}></lightning-menu-item>
		</lightning-button-menu> -->
		<template for:each={modeOptions} for:item="modeOption" for:index="index">
			<lightning-button lwc:if={modeOption.isNotChecked}
				icon-name={modeOption.iconName}
				key={modeOption.value}
				data-value={modeOption.value}
				label={modeOption.label}
				onclick={handleOnModeClick}></lightning-button>
		</template>
	</lightning-button-group>
	<div lwc:if={isError}
		class="slds-var-p-horizontal_small">
		<c-error-panel error-title={errorTitle}
			error-object={errorObject}></c-error-panel>
	</div>
	<c-line-item-manager lwc:if={isReady}
		title="Steps"
		mode={mode}
		variant="details"
		details={details}
		status-options={statusOptions}
		selected-item-id={selectedItemId}
		onitemcreate={handleItemCreated}
		onitemchange={handleItemChange}
		onitemdelete={handleItemDelete}
		onitemselected={handleOnItemSelected}
		onitemcomeplete={handleOnItemComplete}
		oniteminprogress={handleOnItemInProgress}>
	</c-line-item-manager>
	<!-- <template lwc:if={isLoading}>
		<lightning-spinner variant="brand"
			alternative-text="Loading..."></lightning-spinner>
	</template> -->
</lightning-card>
</template>
