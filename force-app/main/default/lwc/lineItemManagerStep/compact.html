<template>
<div class="procedure-panel compact">
<div role="group"
	class="slds-is-relative slds-button-group prod">
	<button class={compactProcedureClass}
		type="button"
		onclick={handleOnItemClick}
		style="min-width:6rem;">
		<lightning-icon lwc:if={_item.isComplete}
			icon-name="utility:check"
			size="x-small"
			variant="inverse"
			class="slds-button__icon slds-button__icon_left"></lightning-icon>
		{_item.procedureName}
	</button>
</div>
</div>
<div lwc:if={_item.hasError}
	class="slds-var-p-horizontal_small slds-var-p-vertical_xx-small">
	<c-error-panel error-title={_item.errorMessage}
		error-object={_item.errorObject}
		variant="compact"></c-error-panel>
</div>
</template>
