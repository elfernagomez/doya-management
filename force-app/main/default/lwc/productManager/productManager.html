<template>
<div lwc:if={isError}
	class="slds-theme_default slds-var-m-bottom_small">
	<c-error-panel error-title={errorTitle}
		error-object={errorObject}></c-error-panel>
</div>
<div lwc:if={hasProducts}>
	<template for:each={_products}
		for:item="product"
		for:index="index">
		<div lwc:if={product.isVisible}
			key={product.uniqueId}
			data-is-part={product.isPart}
			class="product-row">
			<c-product-card product={product}
				data-index={index}
				mode={mode}
				variant={variant}
				allow-delete-on-view={allowDeleteOnView}
				allow-create-work-order-on-view={allowCreateWorkOrderOnView}
				hide-qty={hideQty}
				hide-unit-type={hideUnitType}
				hide-unit-price={hideUnitPrice}
				hide-dimensions={hideDimensions}
				hide-totals={hideTotals}
				hide-create-work-order-button={hideCreateWorkOrderButton}
				onproductchange={handleOnProductChange}
				onproductdelete={handleOnProductDelete}
				onproductdragstart={handleOnProductDragStart}
				onproductdragend={handleOnProductDragEnd}
				></c-product-card>
		</div>
	</template>
</div>
<div lwc:if={showAddProduct}
	class="slds-var-m-top_small"
	style="max-width:24rem;">
	<lightning-record-picker
		label="Add Product"
		variant="label-hidden"
		placeholder="Add Product..."
		object-api-name="Product2"
		filter={productFilter}
		onchange={handleOnSelectedProductChange}></lightning-record-picker>
</div>
</template>
