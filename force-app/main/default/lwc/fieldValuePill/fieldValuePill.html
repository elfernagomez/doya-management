<template>
<lightning-pill lwc:if={isPill}
	label={displayValue}
	onremove={handleOnRemoveClick}>
	<!-- <lightning-icon lwc:if={iconName}
		icon-name={iconName}
		alternative-text={displayValue}></lightning-icon> -->
	<!-- <template lwc:if={showIcon}> -->
		<span title={displayValue}
			style={iconStyle}
			class="slds-icon_container">
			<img lwc:if={showIcon}
				src={iconUrl}
				class="slds-icon" aria-hidden="true" />
			<lightning-icon lwc:else
				icon-name="standard:text"
				size="xx-small"></lightning-icon>
			<span class="slds-assistive-text">{displayValue}</span>
		</span>
	<!-- </template> -->
</lightning-pill>
<div lwc:if={isTile}
	class="slds-media slds-box slds-box_x-small">
	<div lwc:if={iconUrl}
		class="slds-media__figure">
		<span title={displayValue}
			style={iconStyle}
			class="slds-icon_container">
			<img src={iconUrl}
				class="slds-icon"
				aria-hidden="true" />
			<span class="slds-assistive-text">{displayValue}</span>
		</span>
	</div>
	<div class="slds-media__body">
		<p>{displayValue}</p>
		<p lwc:if={label}
			title={label}
			class="slds-truncate slds-text-color_weak">{label}</p>
	</div>
	<div class="slds-media__figure slds-media__figure_reverse">
		<lightning-button-icon variant="bare"
			size="small"
			icon-name="utility:close"
			title="Remove"
			onclick={handleOnRemoveClick}></lightning-button-icon>
	</div>
</div>
</template>
