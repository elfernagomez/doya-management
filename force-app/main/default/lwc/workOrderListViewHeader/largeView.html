<template>
<c-page-header icon-name={iconName}
	title={title}
	subtitle={subtitle}
	list-views={listViews}
	selected-list-view={selectedListView}
	actions={actions}
	is-for-list-view=true
	is-filter-list-open={isFilterListOpen}
	onactionselect={handleOnActionSelect}
	onlistviewbuttonclick={handleOnLisViewButtonClick}
	onsearchtextchange={handleOnSearchTextChange}>	
	<div slot="extra"
		class="slds-page-header__row">
		<!-- <div lwc:if={statusOptions}
			class="slds-page-header__col-meta compact-buttons">
			<c-checkbox-group
				options={statusOptions}
				onchange={handleStatusOptionsLocalChange}></c-checkbox-group>
		</div> -->
		<div class="slds-page-header__col-meta">
			<c-field-value-pill
				for:each={selectedStatuses}
				for:item="o"
				for:index="i"
				key={o.key}
				label={o.label}
				value={o.value}
				field-api-name="Status"
				data-key={o.key}
				variant="pill"
				onremove={handleOnStatusRemoved}
				class="slds-var-m-right_xx-small"></c-field-value-pill>

			<c-field-value-pill
				for:each={filtersList}
				for:item="f"
				for:index="i"
				key={f.fieldApiName}
				label={f.label}
				value={f.value}
				field-api-name={f.fieldApiName}
				data-index={i}
				variant="pill"
				onremove={handleOnFilterRemoved}
				class="slds-var-m-right_xx-small"></c-field-value-pill>
		</div>
		<div lwc:if={showSelectionActions}
			class="slds-page-header__col-controls">
			<div class="slds-page-header__controls">
				<div lwc:if={showSetAsCurrentStepSelectionActions}
					class="slds-page-header__control">
					<lightning-button label="Set As Current Step"
						name="setAsCurrentStep"
						alternative-text="Set All As Current Step"
						variant="brand-outline"
						onclick={handleOnSetAllAsCurrentStepClick}></lightning-button>
				</div>
				<div lwc:if={showCompleteStepSelectionActions}
					class="slds-page-header__control">
					<lightning-button label="Complete All Steps"
						name="completeStep"
						alternative-text="Complete All Steps"
						variant="brand"
						onclick={handleOnCompleteAllStepsClick}></lightning-button>
				</div>
				<div class="slds-page-header__control">
					<lightning-button label="Deselect All"
						name="deselectAll"
						variant="base"
						alternative-text="Deselect All"
						onclick={handleOnDeselectAllClick}></lightning-button>
				</div>
			</div>
		</div>
	</div>
</c-page-header>
<lightning-layout vertical-align="stretch"
	class="slds-border_top slds-border_bottom"
	style={tableHeaderRowStyle}>
	<lightning-layout-item size="8">
		<lightning-layout vertical-align="stretch">
			<lightning-layout-item scope="col"
				style={rowNumberColumnStyle}
				class="slds-is-resizable
					slds-is-sortable
					slds-cell_action-mode">&nbsp;</lightning-layout-item>
			<lightning-layout-item scope="col"
				flexibility="no-flex"
				style={rowCheckboxColumnStyle}>
				<div class="slds-th__action">
					<div class="slds-checkbox">
						<lightning-input type="checkbox"
							variant="label-hidden"
							checked={isAllSelected}
							onchange={handleOnSelectAllChange}></lightning-input>
					</div>
				</div>
			</lightning-layout-item>
			<lightning-layout-item scope="col"
				for:each={headerColumns}
				for:item="col"
				for:index="i"
				key={col.fieldName}
				title={col.label}
				style={col.styles.header.style}
				class={col.styles.header.class}>
				<a role="button"
					href="#"
					data-field-name={col.fieldName}
					onclick={handleOnColmunClick}
					class="slds-th__action
						slds-text-link_reset">
					<span class="slds-assistive-text">Sort by</span>
					<b class="slds-truncate"
						title={col.label}>{col.label}</b>
					<lightning-icon lwc:if={col.isSortDesc}
						icon-name="utility:arrowdown"
						size="xx-small"
						class={col.sortIconClass}></lightning-icon>
					<lightning-icon lwc:else
						icon-name="utility:arrowup"
						size="xx-small"
						class={col.sortIconClass}></lightning-icon>
				</a>
			</lightning-layout-item>
		</lightning-layout>
	</lightning-layout-item>
	<lightning-layout-item size="4">
		<lightning-layout vertical-align="stretch">
			<lightning-layout-item scope="col"
				class="slds-is-resizable
					slds-is-sortable
					slds-cell_action-mode">&nbsp;</lightning-layout-item>
		</lightning-layout>
	</lightning-layout-item>
</lightning-layout>
<div class="slds-hide">
	<c-time-difference date-time-value={lastUpdated}
		ontimeagoupdate={handleOnTimeAgoUpdate}></c-time-difference>
</div>
</template>
