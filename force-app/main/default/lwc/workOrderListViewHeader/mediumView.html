<template>
<lightning-layout
	class="slds-var-m-bottom_medium">
	<lightning-layout-item flexibility="grow">
		<lightning-input type="search"
			value={searchText}
			data-name="search"
			placeholder="Search Work Orders..."
			variant="label-hidden"
			onchange={handleOnSearchTextChange}></lightning-input>
	</lightning-layout-item>
	<template lwc:if={showSelectionActions}>
		<lightning-layout-item lwc:if={showSetAsCurrentStepSelectionActions}
			class="slds-var-m-left_small">
			<lightning-button label="Set As Current Step"
				name="setAsCurrentStep"
				alternative-text="Set All As Current Step"
				variant="brand-outline"
				onclick={handleOnSetAllAsCurrentStepClick}></lightning-button>
		</lightning-layout-item>
		<lightning-layout-item lwc:if={showCompleteStepSelectionActions}
			class="slds-var-m-left_small">
			<lightning-button label="Complete All Steps"
				name="completeStep"
				alternative-text="Complete All Steps"
				variant="brand"
				onclick={handleOnCompleteAllStepsClick}></lightning-button>
		</lightning-layout-item>
		<lightning-layout-item
			class="slds-var-m-left_small">
			<lightning-button label="Deselect All"
				name="deselectAll"
				variant="base"
				alternative-text="Deselect All"
				onclick={handleOnDeselectAllClick}></lightning-button>
		</lightning-layout-item>
	</template>
</lightning-layout>
<div class="slds-hide">
	<c-time-difference date-time-value={lastUpdated}
		ontimeagoupdate={handleOnTimeAgoUpdate}></c-time-difference>
</div>
</template>
