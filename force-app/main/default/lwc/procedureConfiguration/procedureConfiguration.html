<template>
<lightning-card title={labels.title}
	icon-name="utility:settings"
	variant="narrow">
	<lightning-button icon-name="utility:preview"
		variant="border-filled"
		label="Peview"
		slot="actions"
		onclick={handleOnPreviewClick}></lightning-button>
	<lightning-layout class="slds-var-p-top_xx-small slds-var-p-horizontal_medium">
		<lightning-layout-item size="5"
			class="slds-col">
			<lightning-input type="color"
				label="Color"
				value={colorCode}
				onchange={handleColorChange}></lightning-input>
		</lightning-layout-item>
		<lightning-layout-item size="7"
			class="slds-col">
			<div class="slds-form-element
					slds-form-element_edit
					slds-form-element_readonly
					slds-hint-parent">
				<span title="Field"
					class="slds-form-element__label">Fields</span>
				<div class="slds-form-element__control">
					<div class="slds-form-element__static">
						<c-field-multi-selector record-id={recordId}
							mode={fieldsMode}
							title="Production Fields"
							object-api-name={objectApiName}
							source-object-api-name="ProductionOrderLineItem__c"
							result-field-api-name="ProductionFieldsJson__c"
							excluded-fields={excludedFields}
							onsave={handleOnFieldsSave}>
						</c-field-multi-selector>
					</div>
					<!-- sldsValidatorIgnoreNextLine -->
					<lightning-button-icon lwc:if={isFieldsInViewMode}
						icon-name="utility:edit"
						title="Edit Fields"
						aria-label="Edit Fields"
						variant="bare"
						onclick={handleOnEditFieldsClick}
						class="slds-float_right"></lightning-button-icon>
					<!-- sldsValidatorIgnoreNextLine -->
					<lightning-button-icon lwc:if={isFieldsInEditMode}
						icon-name="utility:close"
						title="Cancel Edit"
						aria-label="Cancel Edit"
						variant="bare"
						onclick={handleOnCancelFieldsClick}
						class="slds-float_right"></lightning-button-icon>
				</div>
			</div>
		</lightning-layout-item>
	</lightning-layout>
</lightning-card>
<c-modal size="large"
	footer-hidden=true
	class="previewModal">
	<div slot="header">
		<p>{procedureName}</p>
		<p class="slds-text-heading_small">Line Item Preview</p>
	</div>
	<div slot="body"
		class="slds-var-p-around_medium">
		<div class="slds-grid
				slds-grid_align-center">
			<lightning-radio-group name="radioGroup"
				alternative-text="Preview Mode"
				options={previewModeOptions}
				value={previewMode}
				type="button"
				variant="label-hidden"
				onchange={handlePreviewModeChange}></lightning-radio-group>
		</div>
		<div lwc:if={previewItems}
			class="slds-var-p-around_large">
			<div for:each={previewItems}
				for:item="item"
				for:index="index"
				key={item.uniqueId}
				class="slds-var-m-bottom_xx-small">
				<!-- <c-line-item-manager-step item={item}
					procedure-options={previewProcedureOptions}
					mode={previewMode}></c-line-item-manager-step> -->
			</div>
		</div>
	</div>
</c-modal>
</template>
