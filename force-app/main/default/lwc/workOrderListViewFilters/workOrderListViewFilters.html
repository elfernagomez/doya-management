<template>
<div lwc:if={show}
	class="slds-panel
		slds-size_medium
		slds-panel_docked
		slds-panel_docked-right
		slds-is-open
		slds-is-absolute"
	style="top:0;right:0;">
	<div class="slds-panel__header">
		<h2 class="slds-panel__header-title
				slds-text-heading_small
				slds-truncate"
			title="Filters">Filters</h2>
		<div class="slds-panel__header-actions">
			<lightning-button-icon icon-name="utility:close"
				title="Collapse Panel Header"
				onclick={handleOnClosePanelClick}
				class="slds-button
					slds-button_icon
					slds-button_icon-small
					slds-panel__close"></lightning-button-icon>
		</div>
	</div>
	<div class="slds-panel__body">
		<!-- <ul lwc:if={filtersList.length}
			class="slds-has-dividers_around-space">
			<li for:each={filtersList}
				for:item="f"
				for:index="i"
				key={f.fieldApiName}
				class="slds-item">
				<c-field-value-pill
					label={f.label}
					value={f.value}
					field-api-name={f.fieldApiName}
					data-index={i}
					variant="tile"
					onremove={handleOnFilterRemoved}
					class="slds-var-m-right_xx-small"></c-field-value-pill>
			</li>
		</ul> -->
		<template lwc:if={filtersList.length}>
			<div for:each={filtersList}
				for:item="f"
				for:index="i"
				key={f.fieldApiName}
				class="slds-var-m-bottom_small">
				<c-field-value-pill
					label={f.label}
					value={f.value}
					field-api-name={f.fieldApiName}
					data-index={i}
					variant="tile"
					onremove={handleOnFilterRemoved}></c-field-value-pill>
			</div>
		</template>
		<div lwc:else>
			There are no filters yet.
		</div>
		<lightning-card title="Status"
			class="slds-var-p-horizontal_small">
			<lightning-layout multiple-rows="true"
				class="slds-var-p-horizontal_small">
				<lightning-layout-item for:each={statusOptions}
					for:item="option"
					key={option.value}
					class="slds-box
						slds-box_xx-small
						slds-theme_shade
						slds-var-m-right_small
						slds-var-m-bottom_small">
					<lightning-input type="checkbox"
						name={option.key}
						data-key={option.key}
						label={option.label}
						value={option.isSelected}
						checked={option.isSelected}
						onchange={handleStatusOptionsLocalChange}></lightning-input>
				</lightning-layout-item>
			</lightning-layout>
		</lightning-card>
		<lightning-card title="Add Filters"
			class="slds-var-p-horizontal_small">
			<div class="slds-var-p-horizontal_small">
				<lightning-record-edit-form lwc:if={showForm}
					object-api-name={objectApiName}>
					<div for:each={fields}
						for:item="f"
						for:index="i"
						key={f.apiName}>
						<lightning-input-field labe={f.label}
							field-name={f.apiName}
							data-field-name={f.apiName}
							onchange={handleOnFilterFieldChange}></lightning-input-field>
					</div>
				</lightning-record-edit-form>
			</div>
			<div slot="footer">
				<lightning-button label="Apply"
					name="apply"
					variant="brand"
					disabled={isApplyButtonDisabled}
					onclick={handleOnApplyFiltersClick}
					class="slds-var-m-horizontal_xx-small"></lightning-button>
				<lightning-button label="Apply &amp; Close"
					name="applyAndClose"
					variant="brand"
					disabled={isApplyButtonDisabled}
					onclick={handleOnApplyFiltersClick}
					class="slds-var-m-horizontal_xx-small"></lightning-button>
			</div>
		</lightning-card>
	</div>
</div>
</template>
